name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed
    branches:
      - main
      - master

jobs:
  deploy-to-aws-ec2:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          source: "docker-compose.prod.yml,nginx.conf"
          target: "/home/ubuntu/gym-app"

      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_KEY }}
          script: |
            cd /home/ubuntu/gym-app
            
            # Clean up old docker images/containers to free up space (prevents "no space left on device" errors)
            docker system prune -af
            
            # Create .env file from secrets (ensures server has MONGO_URI, JWT_SECRET, etc.)
            echo "PORT=5000" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "NODE_ENV=production" >> .env
            echo "DISABLE_SECURE_COOKIES=true" >> .env
            echo "CLIENT_URL=http://${{ secrets.AWS_PUBLIC_IP }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env

            # Export Docker Hub username so docker-compose can use it
            export DOCKER_HUB_USERNAME=${{ secrets.DOCKER_HUB_USERNAME }}

            # Pull the latest images from Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # Stop and recreate containers (force fresh start)
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
