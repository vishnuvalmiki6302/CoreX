version: '3.8'

services:
  server:
    image: ${DOCKER_HUB_USERNAME}/gym-server:latest
    ports:
      - "5000:5000"
    env_file:
      - .env  # Server env vars (MONGO_URI, JWT_SECRET, etc.) must exist on EC2 at /home/ubuntu/gym-app/.env
    restart: always

  client:
    image: ${DOCKER_HUB_USERNAME}/gym-client:latest
    ports:
      - "80:3000"  # Vite preview runs on port 3000 (changed from dev server 5173)
    depends_on:
      - server
    restart: always
