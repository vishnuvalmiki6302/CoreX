version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: always

  server:
    image: ${DOCKER_HUB_USERNAME}/gym-server:latest
    expose:
      - "5000"
    env_file:
      - .env
    restart: always

  client:
    image: ${DOCKER_HUB_USERNAME}/gym-client:latest
    expose:
      - "3000"
    restart: always
